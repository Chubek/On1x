# On1x Standard Library Specification
# Version: 0.1.0

metadata:
  language: "On1x"
  version: "0.1.0"
  author: "On1x Language Team"
  description: "Core standard library modules and prelude specification"

prelude:
  description: "Automatically imported into every On1x module without explicit import"
  types:
    - name: "Bool"
      description: "Boolean type (true, false)"
    - name: "Int"
      description: "Signed integer type"
    - name: "Float"
      description: "Floating-point number"
    - name: "Char"
      description: "Unicode character"
    - name: "String"
      description: "UTF-8 encoded string"
    - name: "Unit"
      description: "Unit type ()"
    - name: "Option[T]"
      description: "Optional value (Some(T) | None)"
    - name: "Result[T, E]"
      description: "Result type for error handling (Ok(T) | Err(E))"
    - name: "List[T]"
      description: "Immutable linked list"
    - name: "Ref[T, 'a]"
      description: "Reference with lifetime annotation"
  
  functions:
    - name: "print"
      signature: "String -> Unit"
      description: "Print to stdout without newline"
    - name: "println"
      signature: "String -> Unit"
      description: "Print to stdout with newline"
    - name: "panic"
      signature: "String -> !"
      description: "Abort execution with error message"
    - name: "assert"
      signature: "Bool -> String -> Unit"
      description: "Runtime assertion"
    - name: "id"
      signature: "T -> T"
      description: "Identity function"
    - name: "compose"
      signature: "(B -> C) -> (A -> B) -> (A -> C)"
      description: "Function composition"
    - name: "flip"
      signature: "(A -> B -> C) -> (B -> A -> C)"
      description: "Flip function arguments"
  
  operators:
    - name: "=="
      signature: "T -> T -> Bool"
      description: "Equality"
    - name: "!="
      signature: "T -> T -> Bool"
      description: "Inequality"
    - name: "<, >, <=, >="
      signature: "Ord T => T -> T -> Bool"
      description: "Comparison operators"
    - name: "+, -, *, /"
      signature: "Num T => T -> T -> T"
      description: "Arithmetic operators"
    - name: "&&, ||, !"
      signature: "Bool -> Bool -> Bool"
      description: "Logical operators"
    - name: "|>"
      signature: "T -> (T -> U) -> U"
      description: "Pipeline operator"
    - name: ">>"
      signature: "(A -> B) -> (B -> C) -> (A -> C)"
      description: "Forward composition"

modules:
  - name: "Core"
    path: "std.core"
    description: "Core language primitives and utilities"
    submodules:
      - name: "Option"
        exports:
          functions:
            - name: "map"
              signature: "Option[T] -> (T -> U) -> Option[U]"
            - name: "flatMap"
              signature: "Option[T] -> (T -> Option[U]) -> Option[U]"
            - name: "filter"
              signature: "Option[T] -> (T -> Bool) -> Option[T]"
            - name: "unwrap"
              signature: "Option[T] -> T"
              description: "Panics if None"
            - name: "unwrapOr"
              signature: "Option[T] -> T -> T"
            - name: "isSome"
              signature: "Option[T] -> Bool"
            - name: "isNone"
              signature: "Option[T] -> Bool"
      
      - name: "Result"
        exports:
          functions:
            - name: "map"
              signature: "Result[T, E] -> (T -> U) -> Result[U, E]"
            - name: "mapErr"
              signature: "Result[T, E] -> (E -> F) -> Result[T, F]"
            - name: "flatMap"
              signature: "Result[T, E] -> (T -> Result[U, E]) -> Result[U, E]"
            - name: "unwrap"
              signature: "Result[T, E] -> T"
            - name: "unwrapOr"
              signature: "Result[T, E] -> T -> T"
            - name: "isOk"
              signature: "Result[T, E] -> Bool"
            - name: "isErr"
              signature: "Result[T, E] -> Bool"
      
      - name: "Ordering"
        exports:
          types:
            - name: "Ordering"
              variants: ["Less", "Equal", "Greater"]
          functions:
            - name: "compare"
              signature: "Ord T => T -> T -> Ordering"

  - name: "Collections"
    path: "std.collections"
    description: "Data structures and collection utilities"
    submodules:
      - name: "List"
        exports:
          functions:
            - name: "empty"
              signature: "List[T]"
            - name: "cons"
              signature: "T -> List[T] -> List[T]"
            - name: "head"
              signature: "List[T] -> Option[T]"
            - name: "tail"
              signature: "List[T] -> Option[List[T]]"
            - name: "map"
              signature: "List[T] -> (T -> U) -> List[U]"
            - name: "filter"
              signature: "List[T] -> (T -> Bool) -> List[T]"
            - name: "fold"
              signature: "List[T] -> U -> (U -> T -> U) -> U"
            - name: "length"
              signature: "List[T] -> Int"
            - name: "reverse"
              signature: "List[T] -> List[T]"
            - name: "append"
              signature: "List[T] -> List[T] -> List[T]"
            - name: "take"
              signature: "List[T] -> Int -> List[T]"
            - name: "drop"
              signature: "List[T] -> Int -> List[T]"
      
      - name: "Vector"
        exports:
          types:
            - name: "Vec[T]"
              description: "Dynamic array with O(1) indexed access"
          functions:
            - name: "new"
              signature: "Vec[T]"
            - name: "push"
              signature: "Vec[T] -> T -> Vec[T]"
            - name: "pop"
              signature: "Vec[T] -> Option[(T, Vec[T])]"
            - name: "get"
              signature: "Vec[T] -> Int -> Option[T]"
            - name: "set"
              signature: "Vec[T] -> Int -> T -> Vec[T]"
            - name: "length"
              signature: "Vec[T] -> Int"
            - name: "map"
              signature: "Vec[T] -> (T -> U) -> Vec[U]"
            - name: "filter"
              signature: "Vec[T] -> (T -> Bool) -> Vec[T]"
      
      - name: "Map"
        exports:
          types:
            - name: "Map[K, V]"
              description: "Immutable hash map"
          functions:
            - name: "empty"
              signature: "Map[K, V]"
            - name: "insert"
              signature: "Map[K, V] -> K -> V -> Map[K, V]"
            - name: "get"
              signature: "Map[K, V] -> K -> Option[V]"
            - name: "remove"
              signature: "Map[K, V] -> K -> Map[K, V]"
            - name: "contains"
              signature: "Map[K, V] -> K -> Bool"
            - name: "keys"
              signature: "Map[K, V] -> List[K]"
            - name: "values"
              signature: "Map[K, V] -> List[V]"
      
      - name: "Set"
        exports:
          types:
            - name: "Set[T]"
              description: "Immutable hash set"
          functions:
            - name: "empty"
              signature: "Set[T]"
            - name: "insert"
              signature: "Set[T] -> T -> Set[T]"
            - name: "remove"
              signature: "Set[T] -> T -> Set[T]"
            - name: "contains"
              signature: "Set[T] -> T -> Bool"
            - name: "union"
              signature: "Set[T] -> Set[T] -> Set[T]"
            - name: "intersection"
              signature: "Set[T] -> Set[T] -> Set[T]"
            - name: "difference"
              signature: "Set[T] -> Set[T] -> Set[T]"

  - name: "IO"
    path: "std.io"
    description: "Input/output operations"
    submodules:
      - name: "File"
        exports:
          types:
            - name: "File"
            - name: "FileMode"
              variants: ["Read", "Write", "Append", "ReadWrite"]
          functions:
            - name: "open"
              signature: "String -> FileMode -> Result[File, IOError]"
            - name: "close"
              signature: "File -> Result[Unit, IOError]"
            - name: "readAll"
              signature: "File -> Result[String, IOError]"
            - name: "readLine"
              signature: "File -> Result[String, IOError]"
            - name: "write"
              signature: "File -> String -> Result[Unit, IOError]"
            - name: "writeLine"
              signature: "File -> String -> Result[Unit, IOError]"
      
      - name: "Console"
        exports:
          functions:
            - name: "readLine"
              signature: "Result[String, IOError]"
            - name: "readAll"
              signature: "Result[String, IOError]"
            - name: "eprint"
              signature: "String -> Unit"
              description: "Print to stderr"
            - name: "eprintln"
              signature: "String -> Unit"

  - name: "Concurrency"
    path: "std.concurrency"
    description: "Concurrency primitives and utilities"
    submodules:
      - name: "Task"
        exports:
          types:
            - name: "Task[T]"
              description: "Asynchronous task handle"
            - name: "Channel[T]"
              description: "Communication channel between tasks"
          functions:
            - name: "spawn"
              signature: "(Unit -> T) -> Task[T]"
            - name: "wait"
              signature: "Task[T] -> T"
            - name: "waitAll"
              signature: "List[Task[T]] -> List[T]"
            - name: "select"
              signature: "List[Task[T]] -> (Task[T], T)"
              description: "Wait for first task to complete"
            - name: "channel"
              signature: "Channel[T]"
            - name: "send"
              signature: "Channel[T] -> T -> Unit"
            - name: "recv"
              signature: "Channel[T] -> T"
            - name: "tryRecv"
              signature: "Channel[T] -> Option[T]"
      
      - name: "Atomic"
        exports:
          types:
            - name: "Atomic[T]"
          functions:
            - name: "new"
              signature: "T -> Atomic[T]"
            - name: "load"
              signature: "Atomic[T] -> T"
            - name: "store"
              signature: "Atomic[T] -> T -> Unit"
            - name: "compareAndSwap"
              signature: "Atomic[T] -> T -> T -> Bool"
            - name: "fetchAdd"
              signature: "Atomic[Int] -> Int -> Int"

  - name: "Math"
    path: "std.math"
    description: "Mathematical functions and constants"
    exports:
      constants:
        - name: "pi"
          signature: "Float"
        - name: "e"
          signature: "Float"
        - name: "tau"
          signature: "Float"
        - name: "infinity"
          signature: "Float"
        - name: "nan"
          signature: "Float"
      functions:
        - name: "abs"
          signature: "Num T => T -> T"
        - name: "min"
          signature: "Ord T => T -> T -> T"
        - name: "max"
          signature: "Ord T => T -> T -> T"
        - name: "clamp"
          signature: "Ord T => T -> T -> T -> T"
        - name: "sqrt"
          signature: "Float -> Float"
        - name: "cbrt"
          signature: "Float -> Float"
        - name: "pow"
          signature: "Float -> Float -> Float"
        - name: "exp"
          signature: "Float -> Float"
        - name: "ln"
          signature: "Float -> Float"
        - name: "log2"
          signature: "Float -> Float"
        - name: "log10"
          signature: "Float -> Float"
        - name: "sin"
          signature: "Float -> Float"
        - name: "cos"
          signature: "Float -> Float"
        - name: "tan"
          signature: "Float -> Float"
        - name: "asin"
          signature: "Float -> Float"
        - name: "acos"
          signature: "Float -> Float"
        - name: "atan"
          signature: "Float -> Float"
        - name: "atan2"
          signature: "Float -> Float -> Float"
        - name: "floor"
          signature: "Float -> Int"
        - name: "ceil"
          signature: "Float -> Int"
        - name: "round"
          signature: "Float -> Int"

  - name: "String"
    path: "std.string"
    description: "String manipulation and formatting utilities"
    exports:
      functions:
        - name: "length"
          signature: "String -> Int"
        - name: "concat"
          signature: "String -> String -> String"
        - name: "split"
          signature: "String -> String -> List[String]"
        - name: "join"
          signature: "List[String] -> String -> String"
        - name: "trim"
          signature: "String -> String"
        - name: "trimStart"
          signature: "String -> String"
        - name: "trimEnd"
          signature: "String -> String"
        - name: "toUpper"
          signature: "String -> String"
        - name: "toLower"
          signature: "String -> String"
        - name: "contains"
          signature: "String -> String -> Bool"
        - name: "startsWith"
          signature: "String -> String -> Bool"
        - name: "endsWith"
          signature: "String -> String -> Bool"
        - name: "indexOf"
          signature: "String -> String -> Option[Int]"
        - name: "substring"
          signature: "String -> Int -> Int -> Option[String]"
        - name: "replace"
          signature: "String -> String -> String -> String"
        - name: "chars"
          signature: "String -> List[Char]"
        - name: "fromChars"
          signature: "List[Char] -> String"
        - name: "format"
          signature: "String -> List[String] -> String"

  - name: "Time"
    path: "std.time"
    description: "Date, time, duration, and monotonic clock operations"
    exports:
      types:
        - name: "Instant"
          description: "Monotonic measurement of a point in time"
        - name: "Duration"
          description: "Span of time between two instants"
        - name: "DateTime"
          description: "Calendar date and wall-clock time representation"
      functions:
        - name: "now"
          signature: "Unit -> Instant"
        - name: "elapsed"
          signature: "Instant -> Duration"
        - name: "sleep"
          signature: "Duration -> Unit"
        - name: "fromMillis"
          signature: "Int -> Duration"
        - name: "fromSecs"
          signature: "Int -> Duration"
        - name: "toMillis"
          signature: "Duration -> Int"
        - name: "toSecs"
          signature: "Duration -> Float"
        - name: "utcNow"
          signature: "Unit -> DateTime"
        - name: "formatIso"
          signature: "DateTime -> String"

  - name: "System"
    path: "std.system"
    description: "Operating system interaction and runtime environment"
    exports:
      types:
        - name: "Process"
        - name: "ExitCode"
          variants: ["Success", "Failure(Int)"]
      functions:
        - name: "args"
          signature: "Unit -> List[String]"
        - name: "getEnv"
          signature: "String -> Option[String]"
        - name: "setEnv"
          signature: "String -> String -> Result[Unit, SystemError]"
        - name: "exit"
          signature: "Int -> !"
        - name: "cwd"
          signature: "Unit -> Result[String, SystemError]"
        - name: "execute"
          signature: "String -> List[String] -> Result[Process, SystemError]"

  - name: "Net"
    path: "std.net"
    description: "Networking, sockets, and basic HTTP abstractions"
    submodules:
      - name: "Tcp"
        exports:
          types:
            - name: "TcpStream"
            - name: "TcpListener"
            - name: "SocketAddr"
          functions:
            - name: "connect"
              signature: "String -> Int -> Result[TcpStream, NetError]"
            - name: "listen"
              signature: "String -> Int -> Result[TcpListener, NetError]"
            - name: "accept"
              signature: "TcpListener -> Result[TcpStream, NetError]"
            - name: "read"
              signature: "TcpStream -> Int -> Result[List[Char], NetError]"
            - name: "write"
              signature: "TcpStream -> String -> Result[Unit, NetError]"
            - name: "close"
              signature: "TcpStream -> Result[Unit, NetError]"

      - name: "Http"
        description: "The HTTP library"
        exports:
          types:
            - name: "Request"
            - name: "Response"
            - name: "HttpMethod"
              variants: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD"]
          functions:
            - name: "get"
              signature: "String -> Result[Response, HttpError]"
            - name: "post"
              signature: "String -> String -> Result[Response, HttpError]"
            - name: "send"
              signature: "Request -> Result[Response, HttpError]"
            - name: "status"
              signature: "Response -> Int"
            - name: "body"
              signature: "Response -> String"

        - name: "JSON"
          description: "JSON serialization/deserialization"
          exports:
            types:
              - name: "Value"
                variants: ["Null", "Bool(Bool)", "Number(Float)", "String(String)", "Array(List[Value])", "Object(Map[String, Value])"]
              - name: "ParseError"
            functions:
              - name: "parse"
                signature: "String -> Result[Value, ParseError]"
              - name: "stringify"
                signature: "Value -> String"
              - name: "stringifyPretty"
                signature: "Value -> Int -> String"
                description: "Pretty print with indentation"
              - name: "get"
                signature: "Value -> String -> Option[Value]"
              - name: "getPath"
                signature: "Value -> List[String] -> Option[Value]"
              - name: "toInt"
                signature: "Value -> Option[Int]"
              - name: "toFloat"
                signature: "Value -> Option[Float]"
              - name: "toString"
                signature: "Value -> Option[String]"
              - name: "toBool"
                signature: "Value -> Option[Bool]"
              - name: "toArray"
                signature: "Value -> Option[List[Value]]"
              - name: "toObject"
                signature: "Value -> Option[Map[String, Value]]"

        - name: "YAML"
          description: "YAML serialization/deserialization"
          exports:
            types:
              - name: "Node"
                variants: ["Scalar(String)", "Sequence(List[Node])", "Mapping(Map[String, Node])"]
              - name: "ParseError"
            functions:
              - name: "parse"
                signature: "String -> Result[Node, ParseError]"
              - name: "parseAll"
                signature: "String -> Result[List[Node], ParseError]"
                description: "Parse multi-document YAML"
              - name: "stringify"
                signature: "Node -> String"
              - name: "get"
                signature: "Node -> String -> Option[Node]"
              - name: "getPath"
                signature: "Node -> List[String] -> Option[Node]"
              - name: "toJson"
                signature: "Node -> Result[JSON.Value, String]"
              - name: "fromJson"
                signature: "JSON.Value -> Node"

        - name: "WASM"
          description: "WebAssembly compilation and interaction"
          exports:
            types:
              - name: "Module"
                description: "Compiled WebAssembly module"
              - name: "Instance"
                description: "Instantiated WebAssembly module"
              - name: "Memory"
                description: "WebAssembly linear memory"
              - name: "Table"
                description: "WebAssembly table"
              - name: "Value"
                variants: ["I32(Int)", "I64(Int)", "F32(Float)", "F64(Float)"]
            functions:
              - name: "compile"
                signature: "List[Char] -> Result[Module, String]"
                description: "Compile WASM binary"
              - name: "instantiate"
                signature: "Module -> Map[String, Value] -> Result[Instance, String]"
              - name: "invoke"
                signature: "Instance -> String -> List[Value] -> Result[List[Value], String]"
              - name: "getExport"
                signature: "Instance -> String -> Option[Value]"
              - name: "getMemory"
                signature: "Instance -> Option[Memory]"
              - name: "readMemory"
                signature: "Memory -> Int -> Int -> List[Char]"
              - name: "writeMemory"
                signature: "Memory -> Int -> List[Char] -> Unit"
              - name: "memorySize"
                signature: "Memory -> Int"
                description: "Size in pages (64KB each)"
              - name: "growMemory"
                signature: "Memory -> Int -> Result[Unit, String]"

        - name: "SIMD"
          description: "Single Instruction Multiple Data operations"
          exports:
            types:
              - name: "Vec4f"
                description: "4-component float vector"
              - name: "Vec8f"
                description: "8-component float vector"
              - name: "Vec4i"
                description: "4-component integer vector"
              - name: "Vec8i"
                description: "8-component integer vector"
            functions:
              - name: "makeVec4f"
                signature: "Float -> Float -> Float -> Float -> Vec4f"
              - name: "makeVec8f"
                signature: "Float -> Float -> Float -> Float -> Float -> Float -> Float -> Float -> Vec8f"
              - name: "makeVec4i"
                signature: "Int -> Int -> Int -> Int -> Vec4i"
              - name: "makeVec8i"
                signature: "Int -> Int -> Int -> Int -> Int -> Int -> Int -> Int -> Vec8i"
              - name: "add"
                signature: "Vec4f -> Vec4f -> Vec4f"
              - name: "sub"
                signature: "Vec4f -> Vec4f -> Vec4f"
              - name: "mul"
                signature: "Vec4f -> Vec4f -> Vec4f"
              - name: "div"
                signature: "Vec4f -> Vec4f -> Vec4f"
              - name: "dot"
                signature: "Vec4f -> Vec4f -> Float"
              - name: "cross"
                signature: "Vec4f -> Vec4f -> Vec4f"
              - name: "length"
                signature: "Vec4f -> Float"
              - name: "normalize"
                signature: "Vec4f -> Vec4f"
              - name: "min"
                signature: "Vec4f -> Vec4f -> Vec4f"
              - name: "max"
                signature: "Vec4f -> Vec4f -> Vec4f"
              - name: "sqrt"
                signature: "Vec4f -> Vec4f"
              - name: "abs"
                signature: "Vec4f -> Vec4f"

        - name: "FFI"
          description: "Foreign Function Interface for C interoperability"
          exports:
            types:
              - name: "Library"
                description: "Dynamically loaded library handle"
              - name: "Function"
                description: "Foreign function handle"
              - name: "CType"
                variants: ["CVoid", "CInt", "CFloat", "CDouble", "CPtr", "CString", "CStruct(String)"]
              - name: "Pointer"
                description: "Raw pointer to foreign memory"
            functions:
              - name: "loadLibrary"
                signature: "String -> Result[Library, String]"
                description: "Load shared library (.so/.dll/.dylib)"
              - name: "getFunction"
                signature: "Library -> String -> List[CType] -> CType -> Result[Function, String]"
              - name: "call"
                signature: "Function -> List[Value] -> Result[Value, String]"
              - name: "allocate"
                signature: "Int -> Pointer"
                description: "Allocate memory (bytes)"
              - name: "free"
                signature: "Pointer -> Unit"
              - name: "read"
                signature: "Pointer -> Int -> List[Char]"
              - name: "write"
                signature: "Pointer -> List[Char] -> Unit"
              - name: "readInt"
                signature: "Pointer -> Int"
              - name: "writeInt"
                signature: "Pointer -> Int -> Unit"
              - name: "readFloat"
                signature: "Pointer -> Float"
              - name: "writeFloat"
                signature: "Pointer -> Float -> Unit"
              - name: "readString"
                signature: "Pointer -> String"
              - name: "writeString"
                signature: "Pointer -> String -> Unit"

        - name: "Parsec"
          description: "Parser combinator library"
          exports:
            types:
              - name: "Parser[T]"
                description: "Parser that produces value of type T"
              - name: "ParseError"
                description: "Parser error with position and message"
            functions:
              - name: "parse"
                signature: "Parser[T] -> String -> Result[T, ParseError]"
              - name: "char"
                signature: "Char -> Parser[Char]"
              - name: "string"
                signature: "String -> Parser[String]"
              - name: "anyChar"
                signature: "Parser[Char]"
              - name: "satisfy"
                signature: "(Char -> Bool) -> Parser[Char]"
              - name: "oneOf"
                signature: "String -> Parser[Char]"
              - name: "noneOf"
                signature: "String -> Parser[Char]"
              - name: "digit"
                signature: "Parser[Char]"
              - name: "letter"
                signature: "Parser[Char]"
              - name: "alphaNum"
                signature: "Parser[Char]"
              - name: "space"
                signature: "Parser[Char]"
              - name: "spaces"
                signature: "Parser[Unit]"
              - name: "newline"
                signature: "Parser[Char]"
              - name: "many"
                signature: "Parser[T] -> Parser[List[T]]"
              - name: "many1"
                signature: "Parser[T] -> Parser[List[T]]"
              - name: "sepBy"
                signature: "Parser[T] -> Parser[S] -> Parser[List[T]]"
              - name: "sepBy1"
                signature: "Parser[T] -> Parser[S] -> Parser[List[T]]"
              - name: "choice"
                signature: "List[Parser[T]] -> Parser[T]"
              - name: "optional"
                signature: "Parser[T] -> Parser[Option[T]]"
              - name: "between"
                signature: "Parser[O] -> Parser[C] -> Parser[T] -> Parser[T]"
              - name: "chainl1"
                signature: "Parser[T] -> Parser[(T -> T -> T)] -> Parser[T]"
              - name: "map"
                signature: "Parser[T] -> (T -> U) -> Parser[U]"
              - name: "bind"
                signature: "Parser[T] -> (T -> Parser[U]) -> Parser[U]"
              - name: "seq"
                signature: "Parser[T] -> Parser[U] -> Parser[
U]"
              - name: "or"
                signature: "Parser[T] -> Parser[T] -> Parser[T]"

        - name: "Assembler"
          description: "Internal assembly code generation and execution"
          exports:
            types:
              - name: "Instruction"
                variants: ["Nop", "Mov(Reg, Reg)", "MovImm(Reg, Int)", "Add(Reg, Reg, Reg)", "Sub(Reg, Reg, Reg)", "Mul(Reg, Reg, Reg)", "Div(Reg, Reg, Reg)", "Jmp(String)", "Jz(Reg, String)", "Jnz(Reg, String)", "Call(String)", "Ret", "Push(Reg)", "Pop(Reg)", "Syscall(Int)"]
              - name: "Reg"
                variants: ["R0", "R1", "R2", "R3", "R4", "R5", "R6", "R7", "SP", "BP", "IP", "FLAGS"]
              - name: "Program"
                description: "Executable program container"
            functions:
              - name: "new"
                signature: "Program"
              - name: "addInstruction"
                signature: "Program -> Instruction -> Program"
              - name: "addLabel"
                signature: "Program -> String -> Program"
              - name: "assemble"
                signature: "Program -> Result[List[Char], String]"
              - name: "disassemble"
                signature: "List[Char] -> Result[Program, String]"

        - name: "JIT"
          description: "Just-In-Time compilation and execution"
          exports:
            types:
              - name: "Context"
                description: "JIT compilation context"
              - name: "Function"
                description: "Executable JIT function handle"
            functions:
              - name: "createContext"
                signature: "Unit -> Context"
              - name: "compileProgram"
                signature: "Context -> Assembler.Program -> Result[Function, String]"
              - name: "invoke"
                signature: "Function -> List[Int] -> Int"
                description: "Execute JIT compiled function"
              - name: "release"
                signature: "Function -> Unit"

        - name: "GC"
          description: "Garbage Collector control and statistics"
          exports:
            types:
              - name: "Stats"
                description: "Garbage collector statistics"
            functions:
              - name: "collect"
                signature: "Unit -> Unit"
                description: "Force garbage collection run"
              - name: "enable"
                signature: "Unit -> Unit"
              - name: "disable"
                signature: "Unit -> Unit"
              - name: "isEnabled"
                signature: "Unit -> Bool"
              - name: "getStats"
                signature: "Unit -> Stats"
              - name: "allocatedBytes"
                signature: "Stats -> Int"
              - name: "liveObjects"
                signature: "Stats -> Int"
              - name: "gcRuns"
                signature: "Stats -> Int"
              - name: "totalGcTime"
                signature: "Stats -> Time.Duration"

